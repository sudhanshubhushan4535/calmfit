# Production scrape config (docker-compose.prod.yml, profile obs): every target is a compose service
# on the internal network. Same jobs as obs/prometheus.yml, so obs/alerts.yml and the dashboard work
# unchanged.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9101"]
  - job_name: worker
    static_configs:
      - targets: ["worker-1:9102", "worker-2:9102"]
