# CalmFit production stack for the Oracle VM (Ampere A1, 2 OCPU / 12 GB, arm64). D49, D50.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod -p calmfit up -d
# Only nginx publishes ports to the internet (80/443). Postgres and Grafana bind to 127.0.0.1 for
# SSH-tunnel access; Prometheus has no host port at all.
#
# Memory limits are budgets, not measurements (D50): long-running total 5,056 MiB of 12 GB, so the
# OS page cache (which Postgres relies on) keeps ~7 GB. Go services get GOMEMLIMIT at ~80% of their
# limit so the GC works harder before the kernel would kill them. CPU limits are caps, not
# reservations, so Kafka or Postgres can't starve the API.

x-go: &go
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-db-url: &db-url postgres://calmfit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/calmfit?sslmode=disable

services:
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      # NGINX_MODE=http until the first certificate exists, then https (D-E, decided at deploy).
      - ./deploy/nginx/${NGINX_MODE:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      api: { condition: service_started }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 64M } }

  api:
    <<: *go
    image: calmfit/api:${IMAGE_TAG:-latest}
    build: { context: ., target: api }
    environment:
      DATABASE_URL: *db-url
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env.prod}
      # production: TEST_AUTH can never be on; the API refuses to start if it is set (D39).
      APP_ENV: production
      APP_CONFIG: config/app.json
      REDIS_URL: redis://redis:6379/0
      METRICS_ADDR: ":9101"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOMEMLIMIT: 200MiB
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "1.0", memory: 256M } }

  # One-shot: schema migrations, then seed data (both idempotent). The API waits for both.
  migrate:
    image: calmfit/api:${IMAGE_TAG:-latest}
    build: { context: ., target: api }
    entrypoint: ["/usr/local/bin/migrate", "up"]
    restart: "no"
    logging: *logging
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 128M } }

  seed:
    image: calmfit/api:${IMAGE_TAG:-latest}
    build: { context: ., target: api }
    entrypoint: ["/usr/local/bin/seed"]
    restart: "no"
    logging: *logging
    environment:
      DATABASE_URL: *db-url
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 128M } }

  relay:
    <<: *go
    image: calmfit/relay:${IMAGE_TAG:-latest}
    build: { context: ., target: relay }
    environment:
      DATABASE_URL: *db-url
      KAFKA_BROKERS: kafka:9092
      GOMEMLIMIT: 100MiB
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 128M } }

  # Two workers in one consumer group (calmfit-stats). Each container has its own network
  # namespace, so both keep the default metrics port :9102.
  worker-1: &worker
    <<: *go
    image: calmfit/worker:${IMAGE_TAG:-latest}
    build: { context: ., target: worker }
    environment:
      DATABASE_URL: *db-url
      KAFKA_BROKERS: kafka:9092
      APP_CONFIG: config/app.json
      METRICS_ADDR: ":9102"
      GOMEMLIMIT: 100MiB
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 128M } }

  worker-2: *worker

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: calmfit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: calmfit
    # shared_buffers is a quarter of the 2 GB limit; the rest is left to the OS page cache.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1536MB", "-c", "max_connections=60"]
    # Loopback only: psql / PILOT_METRICS.sql from the VM or over an SSH tunnel.
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmfit"]
      interval: 5s
      retries: 10
    deploy:
      resources: { limits: { cpus: "1.5", memory: 2048M } }

  # Single KRaft broker, internal listener only. Heap capped at 512 MB (spec: ~512 MB-1 GB); the
  # dev broker with the same heap measured 700 MiB resident, so the limit leaves ~580 MiB headroom.
  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    logging: *logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    deploy:
      resources: { limits: { cpus: "1.0", memory: 1280M } }

  # One-shot: the two topics, exactly as `make topics` (idempotent; retention -1 for replay, D28).
  kafka-init:
    image: apache/kafka:4.3.2
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092"
        $$T --create --if-not-exists --topic workout-events --partitions 3 --config retention.ms=-1
        $$T --create --if-not-exists --topic workout-events-dlq --partitions 1 --config retention.ms=-1
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
    depends_on:
      kafka: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 384M } }

  # Rate limiting only (D34): no persistence, noeviction (fail closed).
  redis:
    image: redis:7.4
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }

  # ---- Cron jobs (profile tools): `docker compose ... run --rm <name>` ----
  reminders:
    image: calmfit/api:${IMAGE_TAG:-latest}
    build: { context: ., target: api }
    profiles: [tools]
    entrypoint: ["/usr/local/bin/reminders"]
    restart: "no"
    logging: *logging
    environment:
      DATABASE_URL: *db-url
      APP_CONFIG: config/app.json
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GOMEMLIMIT: 100MiB
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 128M } }

  backup:
    image: calmfit/backup:${IMAGE_TAG:-latest}
    build: { context: ., target: backup }
    profiles: [tools]
    restart: "no"
    logging: *logging
    environment:
      DATABASE_URL: *db-url
    volumes: ["${BACKUP_DIR:-/var/backups/calmfit}:/backups"]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "1.0", memory: 512M } }

  # ---- Observability (profile obs, D37/D38): reach Grafana over an SSH tunnel only ----
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [obs]
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./obs/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./obs/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    deploy:
      resources: { limits: { cpus: "0.5", memory: 512M } }

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [obs]
    restart: unless-stopped
    logging: *logging
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }

volumes:
  pgdata:
  kafkadata:
  promdata:
  grafanadata:
