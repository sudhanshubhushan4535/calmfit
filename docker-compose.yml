services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: calmfit
      POSTGRES_PASSWORD: calmfit_dev
      POSTGRES_DB: calmfit
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmfit"]
      interval: 5s
      retries: 10

  # Single broker in KRaft mode (no ZooKeeper). Host clients use localhost:9094; containers use kafka:9092.
  # 9094 avoids Postgres 5434, the API 8080 and the default 9092 other local stacks tend to use.
  kafka:
    image: apache/kafka:4.3.2
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # One broker, so every internal topic has replication factor 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (`make topics`) so partition counts are never accidental
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Memory budget from the build spec (~1 GB for Kafka on the 12 GB VM)
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Rate limiting only (D34). Host port 6380: 6379 belongs to the old stack. Counters live a day at
  # most, so no persistence; noeviction makes a full Redis refuse writes (fail closed), never drop limits.
  redis:
    image: redis:7.4
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Observability (D37, D38): only with `make obs-up` (profile "obs"). Bound to 127.0.0.1, so
  # neither UI is reachable from outside the host. Both images are multi-arch (amd64 + arm64).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports: ["127.0.0.1:9095:9090"]
    # The API and workers run on the host (make run / make worker); Linux needs this mapping too.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./obs/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [obs]
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  pgdata:
  kafkadata:
  promdata:
  grafanadata:
