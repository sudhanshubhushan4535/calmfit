services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: calmfit
      POSTGRES_PASSWORD: calmfit_dev
      POSTGRES_DB: calmfit
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmfit"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
